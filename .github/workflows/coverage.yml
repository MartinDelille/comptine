name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Qt version
        id: qt-version
        shell: bash
        run: echo "version=$(cat .qt-version)" >> "$GITHUB_OUTPUT"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qt-version.outputs.version }}
          cache: true

      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Install C++ dependencies
        shell: bash
        run: |
          uv run conan install . \
            --build=missing \
            -pr:h=conan/profiles/linux \
            -pr:b=conan/profiles/linux \
            -s:h build_type=Debug \
            -s:b build_type=Debug

      - name: Configure
        run: qt-cmake --preset=conan-debug -DCOMPTINE_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build --preset=conan-debug

      - name: Test
        run: ctest --test-dir build/Debug --output-on-failure

      - name: Generate LCOV report
        shell: bash
        run: |
          lcov --capture \
            --directory build/Debug \
            --output-file coverage.info \
            --ignore-errors mismatch
          lcov --remove coverage.info \
            '*/tests/*' \
            '*/build/*' \
            '/usr/*' \
            '*/.conan2/*' \
            --output-file coverage.info \
            --ignore-errors unused

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
