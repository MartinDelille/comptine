name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Qt version
        id: qt-version
        shell: bash
        run: echo "version=$(cat .qt-version)" >> "$GITHUB_OUTPUT"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qt-version.outputs.version }}
          cache: true

      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Install C++ dependencies
        shell: bash
        run: |
          uv run conan install . \
            --build=missing \
            -pr:h=conan/profiles/linux \
            -pr:b=conan/profiles/linux \
            -s:h build_type=Debug \
            -s:b build_type=Debug

      - name: Configure
        run: cmake --preset=coverage

      - name: Build
        run: cmake --build --preset=coverage

      - name: Test
        run: ctest --test-dir build/Coverage --output-on-failure

      - name: Generate LCOV report
        shell: bash
        run: bash scripts/generate-coverage.sh

      - name: Archive LCOV report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info
          if-no-files-found: error

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
