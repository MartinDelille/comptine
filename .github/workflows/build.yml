name: Build

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: MacOS
            artifact-path: build/Release/Comptine-*.dmg
            release-file: build/Release/Comptine-*.dmg
            ctest-dir: build/Release
            conan-profile: conan/profiles/macos
          - os: ubuntu-latest
            name: Linux
            artifact-path: build/Comptine-*.AppImage
            release-file: build/Comptine-*.AppImage
            ctest-dir: build/Release
            conan-profile: conan/profiles/linux
          - os: windows-latest
            name: Windows
            artifact-path: Comptine-Windows.exe
            release-file: Comptine-Windows.exe
            cmake-build-args: --config Release
            ctest-dir: build
            conan-profile: conan/profiles/windows

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Qt version
        id: qt-version
        shell: bash
        run: echo "version=$(cat .qt-version)" >> $GITHUB_OUTPUT

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qt-version.outputs.version }}
          cache: true

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libfuse2

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nsis -y

      - name: Setup MSVC environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ matrix.os }}-

      - name: Install C++ dependencies
        shell: bash
        run: |
          uv run conan install . \
          --build=missing \
          -pr:h=${{ matrix.conan-profile }} \
          -pr:b=${{ matrix.conan-profile }}

      - name: Configure
        run: cmake --preset=conan-release

      - name: Build
        run: cmake --build --preset=conan-release

      - name: Test
        run: ctest --test-dir ${{ matrix.ctest-dir }} --output-on-failure ${{ matrix.ctest-args }}

      - name: Run qmllint
        if: matrix.os == 'macos-latest'
        run: |
          find . \
            -path './build' -prune -o \
            -type f -name '*.qml' \
            -exec qmllint --max-warnings 0 --qmldirs build/Release {} +

      - name: Deploy Qt (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          expected_version=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_version="$GITHUB_REF_NAME"
          fi
          macdeployqt build/Release/app/Comptine.app -qmldir=.
          bash scripts/sign-macos-bundle.sh build/Release/app/Comptine.app "$expected_version"
          bash scripts/validate-macos-bundle.sh build/Release/app/Comptine.app "$expected_version"
          test "$(lipo -archs build/Release/app/Comptine.app/Contents/MacOS/Comptine)" = "arm64"

      - name: Create and validate installer (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd build/Release
          cpack -G DragNDrop
          dmg=$(find . -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          expected_version=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_version="$GITHUB_REF_NAME"
          fi
          bash "$GITHUB_WORKSPACE/scripts/validate-macos-dmg.sh" \
            "$dmg" \
            "$expected_version" \
            arm64 \
            "$GITHUB_WORKSPACE/long_example.comptine"

      - name: Capture screenshots (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          ./scripts/capture-screenshots.sh \
            build/Release/app/Comptine.app \
            long_example.comptine \
            screenshots

      - name: Upload screenshots
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png

      - name: Create installer (Windows)
        if: matrix.os == 'windows-latest'
        run: cpack --config build/CPackConfig.cmake -G NSIS

      - name: Create installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download
          PLUGIN_QT_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download
        run: |
          cd build
          wget -q $LINUXDEPLOY_URL/continuous/linuxdeploy-x86_64.AppImage
          wget -q $PLUGIN_QT_URL/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QML_SOURCES_PATHS="${{ github.workspace }}"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable Release/app/Comptine \
            --icon-file ../comptine.svg \
            --desktop-file ../comptine.desktop \
            --plugin qt \
            --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Comptine-${{ matrix.name }}
          path: ${{ matrix.artifact-path }}

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.release-file }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Get previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.prev-tag.outputs.tag }}"
          if [ -n "$PREV_TAG" ]; then
            # Get commits, exclude merge commits
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges $PREV_TAG..HEAD)
          else
            CHANGELOG="- Initial release"
          fi
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate signed update manifest
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.COMPTINE_UPDATE_PRIVATE_KEY }}
        run: |
          test -n "$UPDATE_PRIVATE_KEY"
          printf '%s' "$UPDATE_PRIVATE_KEY" > update-private.pem
          printf '%s' "${{ github.ref_name }}" > release-version.txt
          printf '%s\n' "See the GitHub release notes for this version." > release-notes.txt
          RELEASE_BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          python3 scripts/create-update-manifest.py \
            --version "${{ github.ref_name }}" \
            --notes release-notes.txt \
            --private-key update-private.pem \
            --output Comptine-update.json \
            --asset macos arm64 "$RELEASE_BASE/Comptine-MacOS.dmg" \
              Comptine-MacOS.dmg "" \
            --asset windows x86_64 "$RELEASE_BASE/Comptine-Windows.exe" \
              Comptine-Windows.exe "" \
            --asset linux x86_64 "$RELEASE_BASE/Comptine-x86_64.AppImage" \
              Comptine-x86_64.AppImage ""
          rm -f update-private.pem

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare
        with:
          files: |
            *.dmg
            *.AppImage
            *.exe
            Comptine-update.json
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.content }}

            **[Full Changelog](${{ env.COMPARE_URL }}/${{ steps.prev-tag.outputs.tag }}...${{ github.ref_name }})**

  comment-artifacts:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Get artifact URLs
        id: artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const links = artifacts.artifacts.map(a => {
              const baseUrl = 'https://nightly.link';
              const repo = `${context.repo.owner}/${context.repo.repo}`;
              const path = `actions/runs/${context.runId}/${a.name}.zip`;
              return `- [${a.name}](${baseUrl}/${repo}/${path})`;
            }).join('\n');
            core.setOutput('links', links);

      - name: Post artifact links
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## Build Artifacts

            Download the build artifacts for this PR (commit ${{ github.event.pull_request.head.sha }}):

            ${{ steps.artifacts.outputs.links }}
          comment-tag: build-artifacts
