name: Translations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  translations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Qt version
        id: qt-version
        run: echo "version=$(cat .qt-version)" >> $GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qt-version.outputs.version }}
          cache: true

      - name: Check translations complete
        run: ./scripts/check-translations.sh

      - name: Check generated translation changes
        run: git diff --exit-code -- translations/comptine_fr.ts
