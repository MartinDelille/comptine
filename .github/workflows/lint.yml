name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dev dependencies
        run: uv sync

      - name: Read Qt version
        id: qt-version
        run: echo "version=$(cat .qt-version)" >> $GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qt-version.outputs.version }}
          cache: true

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Install C++ dependencies
        shell: bash
        run: |
          uv run conan install . \
            --build=missing \
            -pr:h=conan/profiles/linux \
            -pr:b=conan/profiles/linux \
            -s:h build_type=Debug \
            -s:b build_type=Debug

      - name: Configure analysis
        run: cmake --preset=analysis

      - name: Build with clang-tidy
        run: cmake --build --preset=analysis
